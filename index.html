<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: app shell — navy status card over a light board grid; pill nav on desktop, fixed tab bar on phones. */
:root{
  --bg:#ffffff; --surface:#f5f7fc; --surface-2:#eef2fb; --line:#e4e4e7;
  --ink:#121212; --body:#3d4c65; --muted:#8e97ab;
  --brand:#2258e7; --brand-ink:#183c9e; --brand-soft:#e9eefd;
  --hero-bg:#001334; --hero-fg:#ffffff; --hero-dim:#8fa3c9; --hero-line:#143059;
  --cell-bg:#ffffff; --cell-fg:#3d4c65; --cell-line:#e4e4e7;
  --done-bg:#2258e7; --done-fg:#ffffff;
  --win-bg:#001334; --win-fg:#ffffff;
  --danger:#f04438;
  --shadow:0 1px 2px rgba(0,19,52,.05), 0 10px 28px rgba(0,19,52,.07);
  --font:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070d1c; --surface:#0d1730; --surface-2:#13203f; --line:#22304f;
    --ink:#f3f6fc; --body:#aab6cb; --muted:#6d7a94;
    --brand:#5f85ed; --brand-ink:#86a4f3; --brand-soft:#16254a;
    --hero-bg:#13203f; --hero-fg:#f3f6fc; --hero-dim:#8e9db9; --hero-line:#27375c;
    --cell-bg:#0d1730; --cell-fg:#aab6cb; --cell-line:#22304f;
    --done-bg:#26438f; --done-fg:#dde7ff;
    --win-bg:#5f85ed; --win-fg:#06112b;
    --danger:#f97066;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070d1c; --surface:#0d1730; --surface-2:#13203f; --line:#22304f;
  --ink:#f3f6fc; --body:#aab6cb; --muted:#6d7a94;
  --brand:#5f85ed; --brand-ink:#86a4f3; --brand-soft:#16254a;
  --hero-bg:#13203f; --hero-fg:#f3f6fc; --hero-dim:#8e9db9; --hero-line:#27375c;
  --cell-bg:#0d1730; --cell-fg:#aab6cb; --cell-line:#22304f;
  --done-bg:#26438f; --done-fg:#dde7ff;
  --win-bg:#5f85ed; --win-fg:#06112b;
  --danger:#f97066;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.015em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- top bar ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;min-height:60px}
.brandmark{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--ink);font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.dot{width:22px;height:22px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
.badge-demo{font-size:11px;font-weight:600;color:var(--brand-ink);background:var(--brand-soft);border-radius:999px;padding:4px 9px;white-space:nowrap}
.nav-desktop{margin-left:auto;display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:12px}
.nav-desktop button{border:0;background:transparent;color:var(--body);font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:9px}
.nav-desktop button[aria-current="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,19,52,.1)}
@media (max-width:719px){.nav-desktop{display:none}.badge-demo{display:none}}

/* ---- bottom tab bar ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar button[aria-current="true"]{color:var(--brand)}
.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:720px){.tabbar{display:none}}

main{padding-block:20px 104px}
@media (min-width:720px){main{padding-block:26px 56px}}

/* ---- hero ---- */
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero h1{color:var(--hero-fg);font-size:21px;font-weight:800}
.hero .sub{color:var(--hero-dim);font-size:13px;margin-top:3px}
.hero .rank{text-align:right;flex:none}
.hero .rank b{display:block;font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hero .rank span{color:var(--hero-dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hero-line);border-radius:12px;overflow:hidden;margin-top:16px}
.hero-stats div{background:var(--hero-bg);padding:11px 12px}
.hero-stats b{display:block;font-size:19px;font-weight:800;color:var(--hero-fg);font-variant-numeric:tabular-nums}
.hero-stats span{font-size:11.5px;color:var(--hero-dim)}
.hero-bar{margin-top:14px}
.hero-bar .track{height:6px;border-radius:99px;background:var(--hero-line);overflow:hidden}
.hero-bar .fill{height:100%;background:var(--brand);border-radius:99px}
.hero-bar .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--hero-dim);margin-bottom:6px}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px;flex-wrap:wrap}
.section-head h2{font-size:16px;font-weight:700}
.section-head .hint{font-size:12.5px;color:var(--muted)}

/* ---- board ---- */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (min-width:560px){.board{gap:9px}}
.cell{aspect-ratio:1;border:1px solid var(--cell-line);background:var(--cell-bg);color:var(--cell-fg);border-radius:11px;
  padding:6px 4px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:clamp(8.5px,2.35vw,12px);line-height:1.18;font-weight:600;hyphens:auto;overflow-wrap:anywhere;min-width:0;overflow:hidden;
  position:relative;transition:transform .12s ease, box-shadow .12s ease}
@media (min-width:560px){.cell{padding:10px 8px;border-radius:13px}}
.cell:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.cell.done{background:var(--done-bg);border-color:var(--done-bg);color:var(--done-fg)}
.cell.win{background:var(--win-bg);border-color:var(--win-bg);color:var(--win-fg)}
.cell .tick{position:absolute;top:4px;right:4px;width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:3;opacity:.85}
.cell .pin{position:absolute;top:4px;left:5px;font-size:8.5px;font-weight:800;letter-spacing:.04em;opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block;vertical-align:-1px;margin-right:6px}

/* ---- cards ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.grid2{display:grid;gap:12px}
@media (min-width:720px){.grid2{grid-template-columns:1fr 1fr}}

/* ---- feed ---- */
.feed{display:grid;gap:12px}
@media (min-width:720px){.feed{grid-template-columns:1fr 1fr}}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.post-head{display:flex;gap:10px;align-items:center;padding:12px 14px 10px}
.ava{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--brand)}
.post-head .who{font-weight:650;color:var(--ink);font-size:13.5px;line-height:1.25}
.post-head .meta{font-size:11.5px;color:var(--muted)}
.proof{aspect-ratio:16/10;display:grid;place-items:center;gap:7px;color:#cfe0ff;background:linear-gradient(135deg,#1b3a7a,#0a1b3d 70%)}
.proof.v2{background:linear-gradient(135deg,#2258e7,#15306e)}
.proof.v3{background:linear-gradient(135deg,#0d2149,#2b4ea0)}
.proof svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;opacity:.8}
.proof span{font-size:11.5px;letter-spacing:.04em;opacity:.75}
.proof-text{padding:16px 15px;background:var(--surface-2);color:var(--ink);font-size:14px;font-style:italic;line-height:1.45}
.post-body{padding:11px 14px 13px;display:flex;flex-direction:column;gap:9px;flex:1}
.task-chip{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;background:var(--brand-soft);color:var(--brand-ink);
  font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px}
.reacts{display:flex;gap:6px;margin-top:auto}
.react{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--body);font-variant-numeric:tabular-nums}
.react.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

/* ---- tables ---- */
.tabs{display:inline-flex;gap:3px;background:var(--surface);padding:3px;border-radius:10px;margin-bottom:12px}
.tabs button{border:0;background:transparent;font-size:13px;font-weight:650;padding:6px 13px;border-radius:8px;color:var(--body)}
.tabs button[aria-current="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,19,52,.1)}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:11px 14px;background:var(--bg);border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row.me{background:var(--brand-soft)}
.row .pos{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.row.top1 .pos{color:var(--brand)}
.row .nm{font-weight:650;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.row .pts{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .pts small{font-weight:500;color:var(--muted);font-size:11.5px;display:block;text-align:right}

/* ---- HR ---- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.tile b{display:block;font-size:23px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field label{font-size:13.5px;color:var(--ink);font-weight:600}
.field p{margin:2px 0 0;font-size:12px;color:var(--muted);max-width:46ch}
select,input[type=search]{font:inherit;font-size:13.5px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
input[type=search]{width:100%}
.switch{width:42px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-pressed="true"]{background:var(--brand)}
.switch[aria-pressed="true"]::after{transform:translateX(18px)}
.tasktable{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tasktable .thead,.tasktable .trow{display:grid;grid-template-columns:1fr 62px 86px 44px;gap:10px;align-items:center;padding:9px 13px;font-size:13px}
.tasktable .thead{background:var(--surface);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.tasktable .trow{border-top:1px solid var(--line);background:var(--bg)}
.tasktable .trow .t{min-width:0;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tasktable .trow .t small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.scrolly{max-height:430px;overflow-y:auto}
.diff{display:inline-flex;gap:3px}
.diff i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.diff i.on{background:var(--brand)}
.tag{font-size:11px;font-weight:650;color:var(--body);background:var(--surface-2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:12px;font-weight:600;padding:5px 10px;color:var(--body)}
.mini.warn{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 35%, var(--line))}

/* ---- sheet ---- */
.backdrop{position:fixed;inset:0;background:rgba(0,19,52,.45);z-index:40;display:grid;place-items:end center;padding:0}
@media (min-width:620px){.backdrop{place-items:center}}
.sheet{background:var(--bg);width:100%;max-width:470px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  box-shadow:var(--shadow);max-height:88vh;overflow-y:auto}
@media (min-width:620px){.sheet{border-radius:18px;padding-bottom:18px}}
.sheet h3{font-size:18px;font-weight:750;margin-bottom:6px}
.sheet .desc{font-size:14.5px;color:var(--body);margin:0 0 14px}
.sheet .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px 14px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface);margin-bottom:12px}
.drop b{display:block;color:var(--ink);font-size:14px;font-weight:650;margin-bottom:3px}
.note{font-size:11.5px;color:var(--muted);margin:10px 0 0;line-height:1.45}
.btn{display:block;width:100%;border:0;border-radius:11px;background:var(--brand);color:#fff;font-weight:700;font-size:15px;padding:13px}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--body);font-weight:600;font-size:13.5px;padding:10px}
.sheet .closed-by{background:var(--brand-soft);border-radius:11px;padding:12px 14px;font-size:13.5px;color:var(--brand-ink);margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;
  background:var(--hero-bg);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);max-width:90vw;text-align:center}
@media (min-width:720px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brandmark"><span class="dot">E</span>Bingo</div>
    <span class="badge-demo">Prototype · data is made up</span>
    <nav class="nav-desktop" id="navD"></nav>
  </div>
</header>

<main class="wrap">
  <section id="view-board"></section>
  <section id="view-feed" hidden></section>
  <section id="view-rank" hidden></section>
  <section id="view-hr" hidden></section>
</main>

/* ============ board generator: every line gets at least one hard task ============ */
const LINES=(()=>{const L=[];for(let r=0;r<5;r++)L.push([0,1,2,3,4].map(c=>r*5+c));
  for(let c=0;c<5;c++)L.push([0,1,2,3,4].map(r=>r*5+c));
  L.push([0,6,12,18,24]);L.push([4,8,12,16,20]);return L})();
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildBoard(seed){
  const r=rng(seed);
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const center=POOL.find(t=>t.id===51);
  const easy=shuffle(POOL.filter(t=>t.d===1)).slice(0,8);
  const mid=shuffle(POOL.filter(t=>t.d===2)).slice(0,11);
  const hard=shuffle(POOL.filter(t=>t.d===3&&t.id!==51)).slice(0,5);
  const rest=[...easy,...mid,...hard];
  let best=null,bestScore=-1;
  for(let a=0;a<4000;a++){
    const sh=shuffle(rest);let k=0;
    const grid=[];for(let i=0;i<25;i++)grid.push(i===12?center:sh[k++]);
    let ok=true,score=0;
    for(const L of LINES){
      const hardN=L.filter(i=>grid[i].d===3).length;
      const sum=L.reduce((s,i)=>s+grid[i].d,0);
      if(hardN<1||sum<9)ok=false;
      score+=Math.min(hardN,1)*12+sum;
    }
    if(ok)return grid;
    if(score>bestScore){bestScore=score;best=grid}
  }
  return best;
}

function openCell(i){
  const t=BOARD[i],d=state.done.get(i);
  const blocked=!d&&state.todayUsed>=state.dailyLimit;
  const b=document.createElement("div");b.className="backdrop";b.id="bd";
  b.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t.s)}">
    <h3>${esc(t.s)}</h3>
    <p class="desc">${esc(t.f)}</p>
    <div class="meta-row">
      <span class="tag">${["","easy","medium","hard"][t.d]} · ${t.d} ${t.d===1?"point":"points"}</span>
      <span class="tag">proof: ${PROOFLBL[t.p]}</span>
      <span class="tag">${t.t.map(x=>TAGLBL[x]).join(", ")}</span>
      ${i===12?'<span class="tag">shared cell</span>':""}
    </div>
    ${d?`<div class="closed-by">Closed by ${esc(d.by)}, ${esc(d.day)}. The proof is in the feed.</div>
        <button class="btn ghost" data-close>Close</button>`
      :`<div class="drop"><b>Drop a photo here, or click</b>A phone snap, a screenshot or a short note</div>
        <button class="btn" data-take="${i}" ${blocked?"disabled":""}>${blocked?"Daily limit reached":"Close the cell"}</button>
        <p class="note">The cell closes right away and the proof appears in the shared feed. HR can remove it later. Keep code, client data and anyone who has not agreed out of the shot.</p>
        <button class="btn ghost" data-close>Cancel</button>`}
  </div>`;
  document.body.appendChild(b);
}
function toast(msg){
  document.querySelectorAll(".toast").forEach(e=>e.remove());
  const el=document.createElement("div");el.className="toast";el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),2800);
}

document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-v]");            if(nav){go(nav.dataset.v);return}
  const rk=e.target.closest("[data-rank]");          if(rk){state.rankTab=rk.dataset.rank;render();return}
  const cell=e.target.closest(".cell");              if(cell){openCell(+cell.dataset.i);return}
  const cl=e.target.closest("[data-close]");         if(cl){document.getElementById("bd")?.remove();return}
  const rc=e.target.closest("[data-react]");         if(rc){const i=+rc.dataset.react;
    state.reacted.has(i)?state.reacted.delete(i):state.reacted.add(i);render();return}
  const off=e.target.closest("[data-off]");          if(off){const id=+off.dataset.off;
    state.off.has(id)?state.off.delete(id):state.off.add(id);
    off.setAttribute("aria-pressed",String(!state.off.has(id)));return}
  const sw=e.target.closest(".switch:not([data-off])"); if(sw){
    sw.setAttribute("aria-pressed",sw.getAttribute("aria-pressed")==="true"?"false":"true");return}
  const take=e.target.closest("[data-take]");        if(take){
    const i=+take.dataset.take,before=lines().length;
    state.done.set(i,{by:"Anton K.",day:"today"});state.todayUsed++;
    document.getElementById("bd")?.remove();render();
    const after=lines().length;
    toast(after>before?`Line complete! +${BOARD[i].d+5} points`:`Cell closed. +${BOARD[i].d} ${BOARD[i].d===1?"point":"points"}`);
    return}
  if(e.target.id==="bd")document.getElementById("bd")?.remove();
});
