services:
  db:
    image: postgres:16-alpine
    container_name: bingo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: bingo
      POSTGRES_DB: bingo
    ports:
      - "5433:5432"
    volumes:
      - bingo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo -d bingo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bingo-pgdata:
